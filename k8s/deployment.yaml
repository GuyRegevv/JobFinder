apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobfinder
  namespace: jobfinder
  labels:
    app: jobfinder
spec:
  replicas: 1 # SQLite only supports single writer
  selector:
    matchLabels:
      app: jobfinder
  template:
    metadata:
      labels:
        app: jobfinder
    spec:
      containers:
        - name: jobfinder
          image: guyreg/jobfinder:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: jobfinder-config
            - secretRef:
                name: jobfinder-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jobfinder-data
